name: Validate EWT historical data
on:
  push:
    branches: [ewt-data-validation]
    paths: [research/fetch-ewt.py, .github/workflows/ewt-fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas requests
      - run: python research/fetch-ewt.py
      - name: Save matched data to the validation branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ewt-history.json
          git commit -m 'Add EWT and FRED historical data'
          git push
